name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Генерация соответствует спецификации
        # Кодогенератор использует node --experimental-strip-types, флаг появился в Node 22.
        if: matrix.node == 22
        run: pnpm check:codegen

      - name: Типы
        run: pnpm typecheck

      - name: Тесты
        run: pnpm test

      - name: Сборка
        run: pnpm build
